<div class="fondo">
  <form class="form-container" [formGroup]="heroForm" (ngSubmit)="onSubmit()">
    <mat-card>
      <mat-card-title>Editar / Agregar héroe {{ heroForm.value.superhero }}</mat-card-title>
      <mat-card-content class="form-content">
        
        <div class="form-columns">
          
          <div class="form-fields">
            <mat-form-field appearance="fill">
              <mat-label>Nombre héroe</mat-label>
              <input matInput formControlName="superhero" required>
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Alter ego</mat-label>
              <input matInput formControlName="alter_ego" required>
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Primera aparición</mat-label>
              <input matInput formControlName="first_appearance" required>
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Personajes</mat-label>
              <input matInput formControlName="characters" required>
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Editorial</mat-label>
              <mat-select formControlName="publisher">
                <mat-option *ngFor="let pub of publishers" [value]="pub.id">{{ pub.desc }}</mat-option>
              </mat-select>
            </mat-form-field>

            <mat-form-field appearance="fill">
              <mat-label>Imagen Alternativa</mat-label>
              <input matInput type="text" formControlName="alt_img" placeholder="URL de la imagen">
            </mat-form-field>

            <input type="file" (change)="onFileSelected($event)" accept="image/*">
          </div>

          <!-- Columna derecha: Imagen -->
          <div class="image-container">
            <mat-card>
              <img *ngIf="imagePreview" [src]="imagePreview" alt="Vista previa" mat-card-image class="hero-image">
            </mat-card>
          </div>

        </div>
      </mat-card-content>

      <mat-card-actions class="action-buttons">
        <!-- Mostrar el botón de Borrar solo si el héroe tiene ID (estamos editando) -->
        <button *ngIf="heroForm.get('id')?.value" (click)="onDeleteHero()" mat-flat-button type="button">
          <mat-icon>delete</mat-icon> Borrar
        </button>
        
        <button mat-flat-button type="submit">
          <mat-icon>save</mat-icon> Guardar
        </button>
        <button mat-flat-button color="warn" [routerLink]="['/heroes']">
          <mat-icon>cancel</mat-icon> Cancelar
        </button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>

<style>
  .fondo {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #2c3e50, #050505);
  padding: 20px;
}

.form-container {
  width: 100%;
  max-width: 600px;
}

mat-card {
  background: #ffffff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

mat-card-title {
  font-size: 1.5rem;
  font-weight: bold;
  text-align: center;
  color: #2c3e50;
}

.form-content {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-columns {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

@media (min-width: 768px) {
  .form-columns {
    flex-direction: row;
    justify-content: space-between;
  }

  .form-fields {
    width: 60%;
  }

  .image-container {
    width: 35%;
  }
}

mat-form-field {
  width: 100%;
}

.hero-image {
  width: 100%;
  border-radius: 10px;
  border: 2px solid #4ca1af;
}

.action-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

button {
  font-size: 14px;
}

mat-icon {
  margin-right: 5px;
}

</style>
